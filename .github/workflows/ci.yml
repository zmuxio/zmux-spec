name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - 'releases/*'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assets:
    name: Assets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Rebuild generated assets
        run: python tools/rebuild_assets.py

      - name: Check generated assets are up to date
        run: |
          if ! git diff --exit-code; then
            echo "Generated assets are stale; run tools/rebuild_assets.py and commit the result." >&2
            exit 1
          fi

      - name: Validate assets
        run: python tools/validate_assets.py
